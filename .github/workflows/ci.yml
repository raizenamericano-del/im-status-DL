name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: imhub
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: imhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U imhub -d imhub_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://imhub:test-only-password@localhost:5432/imhub_test
      TEST_DATABASE_URL: postgresql://imhub:test-only-password@localhost:5432/imhub_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            docs/*-result.json
            docs/screenshots/
